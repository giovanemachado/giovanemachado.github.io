<!DOCTYPE html>
<html>

<head>

    <link rel="stylesheet" href="assets/build.css">
    <link rel="stylesheet" href="assets/custom.css">
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <!-- shared lists data (also used by blog posts) -->
    <script src="posts/games.js"></script>
    <script src="posts/books.js"></script>

<body onload="firstLoad()">
    <div class="flex justify-center min-h-screen p-[2px] lg:p-[2px]">
        <div id="content"

            <div id="tralha" style="display:none" class="aspect-video w-full overflow-hidden">
                <img class="w-full h-full object-cover" src="assets/tralha.jpeg"
                    alt="um dos meus cachorrinhos / one of my dogs" />
            </div>
            <div id="treco" style="display:none" class="aspect-video w-full overflow-hidden">
                <img class="w-full h-full object-cover" src="assets/treco.png"
                    alt="um dos meus cachorrinhos / one of my dogs" />
            </div>
            <div id="tirulico" style="display:none" class="aspect-video w-full overflow-hidden">

            <div class="flex w-full justify-between mt-0 mb-2">

                    <a class="underline" href="#" onclick="showContent('pt-br')">pt-br</a>

            </div>

                    <div class="border border-dashed border-neutral-400 p-3">
                        <span id="contact-title" class="font-bold"></span>
                        <div id="contact-list"></div>
                    </div>
                    <div class="border border-dashed border-neutral-400 p-3">
                        <span id="blogs-title" class="font-bold"></span>
                        <div id="blogs-list"></div>
                    </div>
                    <div class="border border-dashed border-neutral-400 p-3">
                        <span id="games-title" class="font-bold"></span>
                        <div id="games-list"></div>
                    </div>
                    <div class="border border-dashed border-neutral-400 p-3">
                        <span id="books-title" class="font-bold"></span>
                        <div id="books-list"></div>
                    </div>

            </div>
